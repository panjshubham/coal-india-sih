<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 680" width="100%" height="100%" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Cyan outline glow -->
    <filter id="neon-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00f0ff" flood-opacity="0.45" />
    </filter>
    <filter id="gear-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00c8ff" flood-opacity="0.4" />
    </filter>
    <!-- Arrow Markers -->
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#00e5ff" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f97316" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22c55e" />
    </marker>
    <marker id="arrow-blue-down" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#00d2ff" />
    </marker>
  </defs>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- 1. TOP BATCH GEAR BADGE -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <g transform="translate(180, 20)">
    <!-- Gear Icon -->
    <g transform="translate(45, 30)" filter="url(#gear-glow)">
      <circle cx="0" cy="0" r="28" fill="#0a192f" stroke="#00c8ff" stroke-width="2.5" />
      <!-- Gear Teeth -->
      <path d="M 0 -22 L 0 -28 M 0 22 L 0 28 M -22 0 L -28 0 M 22 0 L 28 0 M -15 -15 L -19 -19 M 15 15 L 19 19 M -15 15 L -19 19 M 15 -15 L 19 -19" stroke="#00c8ff" stroke-width="3.5" stroke-linecap="round" />
      <circle cx="0" cy="0" r="14" fill="#0a192f" stroke="#00c8ff" stroke-width="2" />
      <circle cx="0" cy="0" r="6" fill="#00c8ff" />
    </g>

    <!-- Labels next to Gear -->
    <text x="90" y="27" fill="#ffffff" font-size="16" font-weight="800">/analyze/all</text>
    <text x="90" y="44" fill="#94a3b8" font-size="12" font-weight="600">(Automated Batch Job)</text>
  </g>

  <!-- Downward Arrow to Main Box -->
  <line x1="270" y1="85" x2="270" y2="120" stroke="#00d2ff" stroke-width="2.5" marker-end="url(#arrow-cyan)" />

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- 2. MAIN FASTAPI AI MICROSERVICE CONTAINER -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <g transform="translate(30, 125)">
    <!-- Outer Glow Box -->
    <rect width="480" height="460" rx="30" fill="#071426" stroke="#00e5ff" stroke-width="2.5" filter="url(#neon-glow)" />
    <!-- Inner subtle border -->
    <rect x="6" y="6" width="468" height="448" rx="24" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.4" />

    <!-- Top Header -->
    <g transform="translate(35, 34)">
      <!-- Lightning Icon -->
      <circle cx="15" cy="12" r="13" fill="#059669" />
      <path d="M 13 4 L 18 11 L 14 11 L 16 19 L 10 13 L 15 13 Z" fill="#ffffff" />
      <text x="38" y="18" fill="#ffffff" font-size="17" font-weight="800">FastAPI AI Microservice</text>
    </g>

    <!-- Inside 1: XGBoost (Orange Box) -->
    <g transform="translate(35, 68)">
      <rect width="180" height="175" rx="18" fill="#181318" stroke="#f97316" stroke-width="2" />
      <!-- Inner Gear AI Icon -->
      <g transform="translate(90, 48)">
        <circle cx="0" cy="0" r="22" fill="#271818" stroke="#f97316" stroke-width="1.5" />
        <path d="M 0 -18 L 0 -22 M 0 18 L 0 22 M -18 0 L -22 0 M 18 0 L 22 0 M -12 -12 L -15 -15 M 12 12 L 15 15 M -12 12 L -15 15 M 12 -12 L 15 -15" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" />
        <circle cx="0" cy="0" r="11" fill="#f97316" />
        <text x="0" y="4" fill="#ffffff" font-size="9" font-weight="900" text-anchor="middle">AI</text>
      </g>
      
      <text x="90" y="112" fill="#ffffff" font-size="16" font-weight="800" text-anchor="middle">XGBoost</text>
      <text x="90" y="132" fill="#fdba74" font-size="11" font-weight="600" text-anchor="middle">(ML Risk Predictor)</text>
    </g>

    <!-- Connecting Arrow from XGBoost to SHAP -->
    <line x1="220" y1="155" x2="255" y2="155" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrow-orange)" />

    <!-- Inside 2: SHAP (Purple / Blue Box) -->
    <g transform="translate(265, 68)">
      <rect width="180" height="175" rx="18" fill="#161226" stroke="#818cf8" stroke-width="2" />
      <!-- Tree/Explainable AI Icon -->
      <g transform="translate(90, 48)">
        <circle cx="-16" cy="-12" r="3.5" fill="#f43f5e" />
        <circle cx="0" cy="-14" r="3.5" fill="#a855f7" />
        <circle cx="16" cy="-12" r="3.5" fill="#38bdf8" />
        <circle cx="-8" cy="4" r="3" fill="#ec4899" />
        <circle cx="8" cy="4" r="3" fill="#818cf8" />
        <circle cx="0" cy="14" r="3.5" fill="#c084fc" />
        <!-- Branch Lines -->
        <path d="M -16 -9 L -16 6 M 0 -10 L 0 10 M 16 -9 L 16 6 M -8 7 L 0 14 M 8 7 L 0 14" stroke="#818cf8" stroke-width="1.8" stroke-linecap="round" />
      </g>
      
      <text x="90" y="112" fill="#ffffff" font-size="16" font-weight="800" text-anchor="middle">SHAP</text>
      <text x="90" y="132" fill="#c7d2fe" font-size="11" font-weight="600" text-anchor="middle">(Explainable AI /</text>
      <text x="90" y="148" fill="#c7d2fe" font-size="11" font-weight="600" text-anchor="middle">Top Factors)</text>
    </g>

    <!-- Inside 3: DGMS Logistic Model (Green Box) -->
    <g transform="translate(115, 275)">
      <rect width="250" height="145" rx="18" fill="#0d201b" stroke="#22c55e" stroke-width="2" />
      <!-- Gear AI Icon -->
      <g transform="translate(125, 42)">
        <circle cx="0" cy="0" r="20" fill="#143328" stroke="#22c55e" stroke-width="1.5" />
        <path d="M 0 -16 L 0 -20 M 0 16 L 0 20 M -16 0 L -20 0 M 16 0 L 20 0 M -11 -11 L -14 -14 M 11 11 L 14 14 M -11 11 L -14 14 M 11 -11 L 14 -14" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" />
        <circle cx="0" cy="0" r="10" fill="#22c55e" />
        <text x="0" y="3.5" fill="#ffffff" font-size="8.5" font-weight="900" text-anchor="middle">AI</text>
      </g>
      
      <text x="125" y="96" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle">DGMS Logistic Model</text>
      <text x="125" y="116" fill="#86efac" font-size="11" font-weight="600" text-anchor="middle">(Rule-based Fallback)</text>
    </g>

    <!-- Flow Curves: XGBoost Down to DGMS, DGMS Up to SHAP -->
    <path d="M 75 245 C 75 320, 100 340, 110 340" fill="none" stroke="#00e5ff" stroke-width="2" marker-end="url(#arrow-cyan)" />
    <path d="M 370 340 C 385 340, 405 320, 405 245" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-green)" />
  </g>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- 3. BOTTOM LABEL -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <text x="270" y="630" fill="#ffffff" font-size="17" font-weight="800" text-anchor="middle">FastAPI</text>
  <text x="270" y="650" fill="#ffffff" font-size="17" font-weight="800" text-anchor="middle">AI Microservice</text>
</svg>
