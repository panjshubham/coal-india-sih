<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="alertGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="clipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="alertShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#EF4444" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Circle (Matches 1-4 Feasibility SVGs) -->
  <circle cx="50" cy="50" r="44" fill="#FEF2F2" stroke="#FECACA" stroke-width="2" filter="url(#alertShadow)"/>
  
  <!-- Clipboard Board -->
  <rect x="28" y="24" width="36" height="48" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2.5" />
  
  <!-- Clipboard Header Clip -->
  <rect x="38" y="20" width="16" height="7" rx="2" fill="url(#clipGrad)" stroke="#1E40AF" stroke-width="1.5" />
  <circle cx="46" cy="23.5" r="1.5" fill="#FFFFFF" />

  <!-- Audit Checklist Rows -->
  <!-- Row 1: Passed -->
  <rect x="33" y="33" width="7" height="7" rx="1.5" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5" />
  <path d="M 34.5 36.5 L 36 38 L 38.5 35" fill="none" stroke="#16A34A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="43" y1="36.5" x2="57" y2="36.5" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />

  <!-- Row 2: Passed -->
  <rect x="33" y="44" width="7" height="7" rx="1.5" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5" />
  <path d="M 34.5 47.5 L 36 49 L 38.5 46" fill="none" stroke="#16A34A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="43" y1="47.5" x2="57" y2="47.5" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />

  <!-- Row 3: Falsified / Failed Warning -->
  <rect x="33" y="55" width="7" height="7" rx="1.5" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5" />
  <path d="M 35 57 L 38 60 M 38 57 L 35 60" stroke="#DC2626" stroke-width="1.5" stroke-linecap="round" />
  <line x1="43" y1="58.5" x2="54" y2="58.5" stroke="#EF4444" stroke-width="2" stroke-linecap="round" />

  <!-- Magnifying Glass with Alert Symbol detecting fraud -->
  <!-- Glass Handle -->
  <line x1="68" y1="68" x2="80" y2="80" stroke="#475569" stroke-width="4.5" stroke-linecap="round" />
  <!-- Glass Outer Ring -->
  <circle cx="61" cy="61" r="15" fill="#FFFFFF" stroke="#DC2626" stroke-width="3" />
  <circle cx="61" cy="61" r="12" fill="#FEF2F2" />

  <!-- Warning Triangle inside Glass -->
  <path d="M 61 53 L 69 66 H 53 Z" fill="url(#alertGrad)" stroke="#B91C1C" stroke-width="1" stroke-linejoin="round" />
  <line x1="61" y1="58" x2="61" y2="61.5" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="61" cy="63.5" r="0.8" fill="#FFFFFF" />

  <!-- GPS Geofence Pin at top left (indicating PostGIS fake location detect) -->
  <path d="M 23 20 C 19 20 16 23 16 27 C 16 32 23 38 23 38 C 23 38 30 32 30 27 C 30 23 27 20 23 20 Z" fill="#EF4444" stroke="#B91C1C" stroke-width="1.5" />
  <circle cx="23" cy="26" r="2.5" fill="#FFFFFF" />
  <!-- Tiny warning diagonal slash on pin -->
  <line x1="18" y1="18" x2="28" y2="28" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
</svg>
