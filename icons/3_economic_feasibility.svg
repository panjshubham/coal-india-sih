<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="econGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
    <filter id="econShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#16A34A" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="44" fill="#F0FDF4" stroke="#DCFCE7" stroke-width="2" filter="url(#econShadow)"/>
  
  <!-- Base Coin / Shield -->
  <circle cx="50" cy="50" r="26" fill="url(#econGrad)" />
  <circle cx="50" cy="50" r="22" fill="none" stroke="#BBF7D0" stroke-width="2" stroke-dasharray="3 2" />

  <!-- Rupee Symbol or Zero-Cost Indicator -->
  <path d="M 42 38 H 58 M 42 43 H 56 M 42 38 V 49 C 48 49 54 48 54 53 C 54 58 46 58 42 58 M 47 58 L 57 66" 
        fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
        
  <!-- Small Star Badge Top Right -->
  <circle cx="72" cy="28" r="8" fill="#F59E0B" />
  <path d="M 72 23 L 73.5 26.5 L 77 27 L 74.5 29.5 L 75 33 L 72 31 L 69 33 L 69.5 29.5 L 67 27 L 70.5 26.5 Z" fill="#FFFFFF" />
</svg>
